<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>palindrome checker</h1>
    <input type="text" id="text" placeholder="Enter a string">
    <button onclick="check()">check</button>
    <div id="display"></div>
    <script>
        function check(){
            var str=String(document.getElementById("text").value);
            var rev=str.split("").reverse().join("")
            console.log(rev)
            if(str==rev){
                document.getElementById("display").innerHTML="it is palindrome";
            }else{
                document.getElementById("display").innerHTML="it is not palindrome";
            }
        }
    </script>
</body>
</html>
