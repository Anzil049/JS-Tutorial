<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let userarray=[];
        let input;
        var reverseArray=[];

        while(true){
            input=prompt("Enter the array elements,to quit enter quit");
            if(input.toLowerCase()==="quit"){
                break;
            }
            userarray.push(input);
        }
        document.writeln(`array=${userarray} `,"<br>");
        for(var i=(userarray.length)-1;i>=0;i--){
            var elements=userarray[i];
            // console.log(elements);
            reverseArray.push(elements);
        }
        document.writeln(`Reverse array=${reverseArray}`);
        
    </script>
</body>
</html>
