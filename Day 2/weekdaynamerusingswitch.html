
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Weekday Namer</h1>
    <input type="text" id="num" placeholder="enter a numer b/w 1-7">
    <button onclick="check()">check</button>
    <script>

        function check(){
        var num=document.getElementById("num").value;
        switch(num){
            case "1":alert("sunday");
            break;
            case "2":alert("monday");
            break;
            case "3":alert("tuesday");
            break;
            case "4":alert("wednesday");
            break;
            case "5":alert("thursday");
            break;
            case "6":alert("friday");
            break;
            case "7":alert("saturday");
            break;
            default:alert("enter a number b/w 1-7");
            break;
        }
        }

    </script>
</body>
</html>
