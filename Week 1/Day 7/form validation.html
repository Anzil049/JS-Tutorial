<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Log In</h1>
    <form id="loginform">
        <label for="email">Email</label>
        <input type="text" id="email" ><br>
        <label for="pass">Password</label>
        <input type="password" id="pass"  autocomplete="current-password"><br>
        <button type="submit">Login</button>
    </form>
    <script>

        var form = document.getElementById("loginform");


        function emailcheck(email) {
            return email.indexOf("@") > 0 && email.lastIndexOf(".")>email.indexOf("@")+2 && email.lastIndexOf(".")<email.length-1;

        }


        function passcheck(pass){
            if(pass.length<6) return false;
            
            let hasUpper=false;
            let hasLower=false;
            let hasSpecial=false;
            const specialChars="!@#$%^&*()_+";

            for(i=0;i<pass.length;i++){
                var ch=pass[i];
                if(ch>="A"&& ch<="Z") hasUpper=true;
                else if(ch>="a"&& ch<="z") hasLower=true;
                else if(specialChars.includes(ch)) hasSpecial=true;
            }
            return hasUpper&&hasLower&&hasSpecial;
        }




        form.addEventListener("submit",function(e){
            const email=document.getElementById("email").value;
            const pass=document.getElementById("pass").value;

            
            if(!emailcheck(email)){
                alert("enter a valid email");
                e.preventDefault();
                return;
            }
            if(!passcheck(pass)){
                alert("enter a password having atleast one uppercase,lowercase,special character and minimum 6 characters");
                e.preventDefault();
                return;
            }

            alert("login successfull")
            
        })
    </script>
</body>

</html>
