<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var sum=0;
        for(var i=0;i<=100;i++){
            if(i%2==0){
                console.log(i);
                sum+=i;
            }
        }
        document.writeln(`sum of all even numbers between 1 to 100 are ${sum}`);
    </script>

</body>
